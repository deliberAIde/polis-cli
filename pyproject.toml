[project]
name = "polis-cli"
version = "0.1.0"
description = "Thin command-line client for driving Pol.is-family instances (Pol.is, Voxit) over their HTTP API - create, seed, run, moderate, and export conversations machine-to-machine."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "deliberAIde", email = "info@deliberaide.com" }]
keywords = ["civic-tech", "participation", "agent", "cli", "polis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
    "pydantic>=2.7",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
]

[project.scripts]
polis = "polis_cli.main:app"

[project.urls]
Homepage = "https://github.com/deliberAIde/polis-cli"
Repository = "https://github.com/deliberAIde/polis-cli"
"Agent-bridges toolkit" = "https://github.com/deliberAIde/civic-tech-agent-bridges"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polis_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"
