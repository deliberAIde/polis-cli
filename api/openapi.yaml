openapi: 3.1.0
info:
  title: Pol.is HTTP API (community-documented)
  version: compdemocracy/polis stable@adce54b (2026-07-05)
  description: 'Unofficial OpenAPI description of the Pol.is server API, extracted from source (compdemocracy/polis
    stable@adce54b (2026-07-05)). Pol.is publishes no API contract; endpoints may change without notice. Auth: OIDC
    bearer JWT (email claim required) on current builds; legacy builds use cookie-session via POST /api/v3/auth/login.'
servers:
- url: https://localhost
  description: self-hosted instance
paths:
  /api/v3/all_conversations:
    get:
      operationId: get_all_conversations_list
      summary: Server-operator-only paginated listing of ALL conversations on the instance with participant/comment
        counts and owner_em
      description: 'Handler: handle_GET_all_conversations (server/src/routes/conversations.ts). Auth: moveToBody,
        hybridAuth(assignToP); handler requires isPolisDev(uid) (server-operator whitelist), else 403. Stability:
        internal.'
      tags:
      - all_conversations
      - internal
      responses:
        '200':
          description: '200 JSON {conversations: [...], pagination: {limit, offset, total, ...}}; 403 polis_err_no_access_for_this_user'
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: default 50, capped at 500 by pagination helper
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: ''
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
        description: created (default) | updated/modified | participant_count | comment_count
      - name: sort_dir
        in: query
        required: false
        schema:
          type: string
        description: asc | desc (default)
      - name: owner_email
        in: query
        required: false
        schema:
          type: string
        description: ILIKE substring match on owner email
      - name: is_active
        in: query
        required: false
        schema:
          type: boolean
        description: ''
      - name: recently_updated_days
        in: query
        required: false
        schema:
          type: integer
        description: ''
      - name: recently_created_days
        in: query
        required: false
        schema:
          type: integer
        description: ''
      - name: min_comment_count
        in: query
        required: false
        schema:
          type: integer
        description: ''
      - name: min_participant_count
        in: query
        required: false
        schema:
          type: integer
        description: ''
  /api/v3/auth/deregister:
    post:
      operationId: create_auth_create_deregister
      summary: 'JWT-era logout stub: server does nothing and always returns 200; the client is responsible for discarding
        its JWT (and o'
      description: 'Handler: handle_POST_auth_deregister_jwt in server/src/auth/routes.ts. Auth: none — registered
        with no middleware at all (no auth, no param validators). Stability: core.'
      tags:
      - auth
      - core
      responses:
        '200':
          description: 'JSON {status: ''success'', message: ''Logout successful. Please remove your JWT token.''}'
  /api/v3/bid:
    get:
      operationId: get_bid_list
      summary: Returns the calling user's own base-cluster id (bid) in the conversation, computed by locating their
        pid in the bidToPid
      description: 'Handler: handle_GET_bid (server/src/routes/math.ts). Auth: moveToBody + hybridAuth(assignToP)
        (requires signed-in user; resolves caller''s pid). Stability: core.'
      tags:
      - bid
      - core
      responses:
        '200':
          description: 'JSON {bid: number} or 304'
      parameters:
      - name: conversation_id
        in: query
        required: true
        schema:
          type: string
        description: ''
      - name: math_tick
        in: query
        required: false
        schema:
          type: integer
        description: ''
  /api/v3/bidToPid:
    get:
      operationId: get_bidtopid_get_bidtopid
      summary: 'Returns the full mapping of base-cluster index to participant ids for a conversation (marked in
        source: ''TODO doesn''t sc'
      description: 'Handler: handle_GET_bidToPid (server/src/routes/math.ts). Auth: hybridAuthOptional(assignToP)
        + moveToBody. Stability: core.'
      tags:
      - bidtopid
      - core
      responses:
        '200':
          description: 'JSON {bidToPid: pid[][]} or 304'
      parameters:
      - name: conversation_id
        in: query
        required: true
        schema:
          type: string
        description: ''
      - name: math_tick
        in: query
        required: false
        schema:
          type: integer
        description: ''
  /api/v3/collectiveStatement:
    get:
      operationId: get_collectivestatement_get_collectivestatement
      summary: Fetches stored collective statement(s) from DynamoDB
      description: 'Handler: handle_GET_collectiveStatement in server/src/routes/collectiveStatement.ts. Auth: none
        (moveToBody only). Stability: experimental.'
      tags:
      - collectivestatement
      - experimental
      responses:
        '200':
          description: JSON array or single statement object
      parameters:
      - name: report_id
        in: query
        required: false
        schema:
          type: string
        description: returns all statements for the conversation, deduplicated to latest per topic
      - name: statement_id
        in: query
        required: false
        schema:
          type: string
        description: fetch a single stored statement; one of report_id/statement_id required
    post:
      operationId: create_collectivestatement_create_collectivestatement
      summary: Generates an LLM (Claude via Anthropic SDK) first-person-plural collective statement from high-consensus
        comments of a t
      description: 'Handler: handle_POST_collectiveStatement in server/src/routes/collectiveStatement.ts. Auth:
        moveToBody, hybridAuth(assignToP); additionally requires req.p.delphiEnabled or fails Unauthorized. Stability:
        experimental.'
      tags:
      - collectivestatement
      - experimental
      responses:
        '200':
          description: JSON with generated statement + statement key
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                report_id:
                  type: string
                  description: ''
                topic_key:
                  type: string
                  description: ''
                topic_name:
                  type: string
                  description: ''
                qualifying_tids:
                  type: string
                  description: ''
                group_consensus:
                  type: string
                  description: ''
              required:
              - report_id
              - topic_key
              - topic_name
  /api/v3/comments:
    get:
      operationId: get_comments_list
      summary: 'List a conversation''s comments; legacy bare-array response, or {comments, pagination} wrapper when
        limit is passed (zid '
      description: 'Handler: handle_GET_comments in server/src/routes/comments.ts. Auth: moveToBody, hybridAuthOptional(assignToP),
        resolve_pidThing(''pid''). Stability: core.'
      tags:
      - comments
      - core
      responses:
        '200':
          description: 'JSON array of comment objects (tid, txt, created, mod, is_meta, ...); or {comments: [...],
            pagination: {limit, offset, total, ...}} when limit given'
      parameters:
      - name: conversation_id
        in: query
        required: true
        schema:
          type: string
        description: conversation to list comments for (resolved to internal zid)
      - name: report_id
        in: query
        required: false
        schema:
          type: string
        description: if given, each comment gets an includeInReport flag from report_comment_selections
      - name: tids
        in: query
        required: false
        schema:
          type: string
        description: restrict to specific comment ids
      - name: moderation
        in: query
        required: false
        schema:
          type: boolean
        description: include moderation fields/view (owner/moderator listing)
      - name: mod
        in: query
        required: false
        schema:
          type: integer
        description: filter by exact moderation status (-1 rejected, 0 unmoderated, 1 accepted)
      - name: modIn
        in: query
        required: false
        schema:
          type: boolean
        description: true = comments participant-visible under current strict-mod setting, false = invisible ones
      - name: mod_gt
        in: query
        required: false
        schema:
          type: integer
        description: filter comments with mod greater than this value
      - name: include_voting_patterns
        in: query
        required: false
        schema:
          type: boolean
        description: include agree/disagree/pass counts per comment
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: enables paginated response format; default 50, max 500
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: pagination offset (only with limit)
    post:
      operationId: create_comments_create
      summary: Submit a new comment/statement; creates the participant if missing, runs profanity/toxicity moderation
        (pro conversation
      description: 'Handler: handle_POST_comments in server/src/routes/comments.ts. Auth: hybridAuthOptional(assignToP),
        ensureParticipant({createIfMissing:true, issueJWT:true}), attachAuthToken(). Stability: core.'
      tags:
      - comments
      - core
      responses:
        '200':
          description: JSON {tid, currentPid} (+ auth token via middleware); 409 polis_err_post_comment_duplicate,
            403 polis_err_conversation_is_closed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                conversation_id:
                  type: string
                  description: conversation to post into
                txt:
                  type: string
                  description: the statement text (max 997 chars); duplicates within a conversation are rejected
                    409
                xid:
                  type: string
                  description: external identity id for SSO participants (processed before ensureParticipant)
                vote:
                  type: integer
                  description: auto-vote on own comment (-1 agree, 0 pass, 1 disagree); seed comments default to
                    0 if omitted
                is_seed:
                  type: boolean
                  description: mark as seed statement; auto-approved regardless of moderation settings
              required:
              - conversation_id
              - txt
    put:
      operationId: update_comments_update
      summary: 'Moderate a comment: set active, mod status, and is_meta. Moderator/owner only.'
      description: 'Handler: handle_PUT_comments in server/src/routes/comments.ts. Auth: moveToBody, hybridAuth(assignToP);
        handler enforces isModerator (403 polis_err_update_comment_auth). Stability: admin.'
      tags:
      - comments
      - admin
      responses:
        '200':
          description: JSON {} on success
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                conversation_id:
                  type: string
                  description: conversation the comment belongs to
                tid:
                  type: integer
                  description: comment id to moderate
                active:
                  type: boolean
                  description: whether the comment is active (shown to participants)
                mod:
                  type: integer
                  description: moderation status (-1 rejected, 0 unmoderated, 1 accepted)
                is_meta:
                  type: boolean
                  description: flag comment as meta (excluded from opinion math)
                velocity:
                  type: integer
                  description: required by the validator chain but IGNORED by the handler (update touches only active/mod/is_meta)
              required:
              - conversation_id
              - tid
              - active
              - mod
              - is_meta
              - velocity
  /api/v3/comments-bulk:
    post:
      operationId: create_comments_bulk_create_comments_bulk
      summary: Bulk-upload seed statements from CSV; moderator-only (403 polis_err_post_comment_auth otherwise);
        per-row success/skip/e
      description: 'Handler: handle_POST_comments_bulk in server/src/routes/comments.ts. Auth: hybridAuth(assignToP),
        resolve_pidThing(''pid''). Stability: admin.'
      tags:
      - comments_bulk
      - admin
      responses:
        '200':
          description: 'JSON {results: [{txt, status: success|skipped|error, tid?, reason?, original_id?}], currentPid}'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                conversation_id:
                  type: string
                  description: target conversation
                csv:
                  type: string
                  description: CSV string with header row; columns comment_text and optional original_id; 400 polis_err_param_missing_csv
                    if absent
                is_seed:
                  type: boolean
                  description: treat all rows as seed statements (each gets a default pass vote)
                xid:
                  type: string
                  description: external identity id
              required:
              - conversation_id
              - csv
  /api/v3/comments/translations:
    get:
      operationId: get_comments_get_translations
      summary: Fetch stored translations of a comment for a language; if none exist, translates on demand (external
        translate service),
      description: 'Handler: handle_GET_comments_translations in server/src/routes/comments.ts. Auth: hybridAuth(assignToP).
        Stability: core.'
      tags:
      - comments
      - core
      responses:
        '200':
          description: 'JSON array of comment_translations rows [{zid, tid, lang, txt, ...}]; 404 {error: ''Comment
            not found''}'
      parameters:
      - name: conversation_id
        in: query
        required: true
        schema:
          type: string
        description: conversation the comment belongs to
      - name: tid
        in: query
        required: false
        schema:
          type: integer
        description: comment id — declared optional (want) but the handler dereferences it; effectively required
          (404/500 without it)
      - name: lang
        in: query
        required: false
        schema:
          type: string
        description: target language code; matched on first 2 chars against stored translations; also effectively
          required
  /api/v3/contexts:
    get:
      operationId: get_contexts_list
      summary: List all public context names (contexts group conversations; usable as the context filter on GET
        /conversations).
      description: 'Handler: handle_GET_contexts (closure in server/src/server.ts initializePolisHelpers, ~line
        493). Auth: moveToBody, hybridAuthOptional(assignToP). Stability: legacy.'
      tags:
      - contexts
      - legacy
      responses:
        '200':
          description: 200 JSON array of {name} rows ordered by name
    post:
      operationId: create_contexts_create
      summary: Create a new public context owned by the authenticated user; fails if the name already exists.
      description: 'Handler: handle_POST_contexts (closure in server/src/server.ts initializePolisHelpers, ~line
        511). Auth: hybridAuth(assignToP) — no moveToBody, param must be in JSON body. Stability: legacy.'
      tags:
      - contexts
      - legacy
      responses:
        '200':
          description: 200 JSON {}; 422 polis_err_post_context_exists
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: unique context name
              required:
              - name
  /api/v3/contributors:
    post:
      operationId: create_contributors_create
      summary: Records an open-source contributor-license-agreement signature and emails the team
      description: 'Handler: handle_POST_contributors in server/src/server.ts. Auth: hybridAuthOptional(assignToP).
        Stability: internal.'
      tags:
      - contributors
      - internal
      responses:
        '200':
          description: empty JSON {}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                agreement_version:
                  type: integer
                  description: ''
                name:
                  type: string
                  description: ''
                email:
                  type: string
                  description: ''
                github_id:
                  type: string
                  description: ''
                company_name:
                  type: string
                  description: ''
              required:
              - agreement_version
              - name
              - email
              - github_id
              - company_name
  /api/v3/convSubscriptions:
    post:
      operationId: create_convsubscriptions_create_convsubscriptions
      summary: Subscribe/unsubscribe the authenticated participant to new-statement email notifications for a conversation
        (updates par
      description: 'Handler: handle_POST_convSubscriptions in server/src/routes/notify.ts. Auth: hybridAuth(assignToP).
        Stability: core.'
      tags:
      - convsubscriptions
      - core
      responses:
        '200':
          description: 'JSON object { subscribed: 0 | 1 }'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                conversation_id:
                  type: string
                  description: conversation to (un)subscribe from
                type:
                  type: integer
                  description: 1 = subscribe to email notifications, 0 = unsubscribe; anything else -> 400 polis_err_bad_subscription_type
                email:
                  type: string
                  description: email to store in participants_extended.subscribe_email (used even for type=0, though
                    ignored there)
              required:
              - conversation_id
              - type
              - email
  /api/v3/conversation/close:
    post:
      operationId: create_conversation_create_close
      summary: 'Close a conversation (sets is_active=false). BUG in this build: the handler never sends a success
        response — only error '
      description: 'Handler: handle_POST_conversation_close (server/src/routes/conversations.ts). Auth: moveToBody,
        hybridAuth(assignToP); handler restricts to conversation owner (polis-dev bypasses). Stability: admin.'
      tags:
      - conversation
      - admin
      responses:
        '200':
          description: No response on success (request hangs / times out); 500 polis_err_closing_conversation* on
            error. CLI should fire-and-verify via GET /conversations
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                conversation_id:
                  type: string
                  description: resolved to zid
              required:
              - conversation_id
  /api/v3/conversation/reopen:
    post:
      operationId: create_conversation_create_reopen
      summary: Reopen a closed conversation (sets is_active=true).
      description: 'Handler: handle_POST_conversation_reopen (server/src/routes/conversations.ts). Auth: moveToBody,
        hybridAuth(assignToP); handler restricts to conversation owner (polis-dev bypasses). Stability: admin.'
      tags:
      - conversation
      - admin
      responses:
        '200':
          description: 200 JSON {}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                conversation_id:
                  type: string
                  description: resolved to zid
              required:
              - conversation_id
  /api/v3/conversationStats:
    get:
      operationId: get_conversationstats_get_conversationstats
      summary: 'Participation time-series and histograms for a conversation: every vote/comment timestamp, first-vote/first-comment
        per '
      description: 'Handler: handle_GET_conversationStats (server/src/routes/conversations.ts). Auth: moveToBody,
        hybridAuthOptional(assignToP); handler requires isModerator OR a valid report_id (knowing report_id grants
        access). Stability: admin.'
      tags:
      - conversationstats
      - admin
      responses:
        '200':
          description: 200 JSON {voteTimes, firstVoteTimes, commentTimes, firstCommentTimes, votesHistogram, burstHistogram}
      parameters:
      - name: conversation_id
        in: query
        required: true
        schema:
          type: string
        description: resolved to zid
      - name: report_id
        in: query
        required: false
        schema:
          type: string
        description: grants read access without moderator rights
      - name: until
        in: query
        required: false
        schema:
          type: integer
        description: only include comments/votes created before this ms timestamp
  /api/v3/conversationUuid:
    get:
      operationId: get_conversationuuid_get_conversationuuid
      summary: Get-or-create a persistent UUID for the conversation (stored on the zinvites row); used to give the
        conversation a stabl
      description: 'Handler: handle_GET_conversationUuid (server/src/routes/conversationUuid.ts). Auth: moveToBody,
        hybridAuth(assignToP). Stability: experimental.'
      tags:
      - conversationuuid
      - experimental
      responses:
        '200':
          description: '200 JSON {conversation_uuid} — NOTE: failures also return HTTP 200 with {error: string}'
      parameters:
      - name: conversation_id
        in: query
        required: true
        schema:
          type: string
        description: resolved to zid
  /api/v3/conversations:
    get:
      operationId: get_conversations_list
      summary: List conversations the user owns/co-admins (optionally participates in), list by context, or fetch
        one conversation by c
      description: 'Handler: handle_GET_conversations (server/src/routes/conversations.ts). Auth: moveToBody, hybridAuthOptional(assignToP).
        Stability: core.'
      tags:
      - conversations
      - core
      responses:
        '200':
          description: 200 JSON array of conversation objects (single object when conversation_id given); 403 polis_err_need_auth
            when neither auth, conversation_id, nor context is supplied
      parameters:
      - name: include_all_conversations_i_am_in
        in: query
        required: false
        schema:
          type: boolean
        description: also include conversations the user participates in (not just site-admin/owned)
      - name: is_active
        in: query
        required: false
        schema:
          type: boolean
        description: filter
      - name: is_draft
        in: query
        required: false
        schema:
          type: boolean
        description: filter
      - name: conversation_id
        in: query
        required: false
        schema:
          type: string
        description: if given, returns that single conversation (works without login)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: default 999 when listing
      - name: context
        in: query
        required: false
        schema:
          type: string
        description: list conversations in a context; '/' lists all public root conversations
      - name: xid
        in: query
        required: false
        schema:
          type: string
        description: if set, each conversation's url becomes a single-use /ot/ suzinvite URL for this external id
    post:
      operationId: create_conversations_create
      summary: Create a conversation owned by the authenticated user (org_id defaults to uid, is_public forced true,
        auth_needed_to_vot
      description: 'Handler: handle_POST_conversations (server/src/routes/conversations.ts). Auth: hybridAuth(assignToP)
        — NO moveToBody, params must be in JSON body. Stability: core.'
      tags:
      - conversations
      - core
      responses:
        '200':
          description: 200 JSON {url, conversation_id} (zid stripped by finishOne); 400 polis_err_conversation_id_already_in_use;
            403 polis_err_add_conversation_not_enabled; 500 with Retry-After:0 on duplicate-key race
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                is_active:
                  type: boolean
                  description: default true
                is_draft:
                  type: boolean
                  description: default false
                is_anon:
                  type: boolean
                  description: default false
                owner_sees_participation_stats:
                  type: boolean
                  description: default false
                profanity_filter:
                  type: boolean
                  description: default true
                short_url:
                  type: boolean
                  description: default false; generate a 6-char zinvite instead of 12
                spam_filter:
                  type: boolean
                  description: default true
                strict_moderation:
                  type: boolean
                  description: default false
                context:
                  type: string
                  description: default ''; context (group) name to attach the conversation to
                topic:
                  type: string
                  description: default ''
                description:
                  type: string
                  description: default ''
                conversation_id:
                  type: string
                  description: default ''; claim a previously reserved conversation_id (from POST /reserve_conversation_id);
                    400 if already in use
                is_data_open:
                  type: boolean
                  description: default false
                ownerXid:
                  type: string
                  description: validated but unused by the handler in this build
                treevite_enabled:
                  type: boolean
                  description: default false
                topics_enabled:
                  type: boolean
                  description: default false
    put:
      operationId: update_conversations_update
      summary: Update conversation settings (moderator-only); optionally regenerates a short zinvite and/or sends
        the creation email; r
      description: 'Handler: handle_PUT_conversations (server/src/routes/conversations.ts). Auth: moveToBody, hybridAuth(assignToP);
        handler additionally requires isModerator(zid, uid). Stability: core.'
      tags:
      - conversations
      - core
      responses:
        '200':
          description: 200 (or 201 when short_url) JSON updated conversation object; 403 polis_err_update_conversation_permission
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                conversation_id:
                  type: string
                  description: 'declared twice: resolves zid and keeps the string for URL building'
                is_active:
                  type: boolean
                  description: ''
                is_anon:
                  type: boolean
                  description: ''
                is_draft:
                  type: boolean
                  description: DEFAULT false — omitted means it is actively reset to false
                is_data_open:
                  type: boolean
                  description: DEFAULT false — reset to false when omitted
                owner_sees_participation_stats:
                  type: boolean
                  description: DEFAULT false — reset to false when omitted
                profanity_filter:
                  type: boolean
                  description: ''
                short_url:
                  type: boolean
                  description: DEFAULT false; true regenerates the zinvite as a 6-char short id and returns 201
                spam_filter:
                  type: boolean
                  description: ''
                strict_moderation:
                  type: boolean
                  description: ''
                topic:
                  type: string
                  description: ''
                description:
                  type: string
                  description: ''
                importance_enabled:
                  type: boolean
                  description: ''
                vis_type:
                  type: integer
                  description: ''
                help_type:
                  type: integer
                  description: ''
                write_type:
                  type: integer
                  description: ''
                bgcolor:
                  type: string
                  description: '''default'' clears to null'
                help_color:
                  type: string
                  description: '''default'' clears to null'
                help_bgcolor:
                  type: string
                  description: '''default'' clears to null'
                style_btn:
                  type: string
                  description: ''
                auth_needed_to_vote:
                  type: boolean
